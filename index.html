<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
    .poll-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
    h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 24px; }
    
    .vote-btns { display: flex; gap: 12px; margin-bottom: 30px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.2s ease; }
    .btn-a { background-color: #4f46e5; color: white; }
    .btn-a:hover { background-color: #4338ca; }
    .btn-b { background-color: #ec4899; color: white; }
    .btn-b:hover { background-color: #db2777; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-container { display: flex; flex-direction: column; gap: 18px; }
    .result-item { display: flex; flex-direction: column; gap: 6px; }
    .label-row { display: flex; justify-content: space-between; font-weight: 600; color: #4b5563; font-size: 14px; }
    
    /* CSS 바 차트 스타일 */
    .bar-bg { background-color: #e5e7eb; height: 22px; border-radius: 11px; overflow: hidden; width: 100%; }
    .bar-fill { height: 100%; width: 0%; border-radius: 11px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar-a { background-color: #6366f1; }
    .bar-b { background-color: #f43f5e; }
    
    .total-votes { text-align: right; color: #9ca3af; font-size: 12px; margin-top: 15px; }
    .loading { text-align: center; color: #6b7280; font-size: 14px; display: none; }
  </style>
</head>
<body>

  <div class="poll-card">
    <h2>실시간 투표 및 현황</h2>
    
    <!-- 투표 버튼 -->
    <div class="vote-btns">
      <button class="btn btn-a" onclick="castVote('optionA')">A안 선택</button>
      <button class="btn btn-b" onclick="castVote('optionB')">B안 선택</button>
    </div>

    <div id="loadingText" class="loading">집계 반영 중...</div>

    <!-- 차트 결과 출력부 -->
    <div class="result-container">
      <!-- A안 차트 -->
      <div class="result-item">
        <div class="label-row">
          <span>A안</span>
          <span id="percentA">0% (0표)</span>
        </div>
        <div class="bar-bg">
          <div id="barA" class="bar-fill bar-a"></div>
        </div>
      </div>

      <!-- B안 차트 -->
      <div class="result-item">
        <div class="label-row">
          <span>B안</span>
          <span id="percentB">0% (0표)</span>
        </div>
        <div class="bar-bg">
          <div id="barB" class="bar-fill bar-b"></div>
        </div>
      </div>
    </div>

    <div class="total-votes" id="totalVotes">총 투표수: 0표</div>
  </div>

  <script>
    // 페이지 로드 시 초기 데이터를 GET으로 받아옴
    window.onload = function() {
      fetchVotes();
    };

    // Firebase 데이터 로드
    function fetchVotes() {
      google.script.run
        .withSuccessHandler(renderChart)
        .getVotesFromFirebase();
    }

    // 투표 전송 (POST 처리)
    function castVote(selectedOption) {
      setLoading(true);
      
      google.script.run
        .withSuccessHandler(function(response) {
          setLoading(false);
          const result = JSON.parse(response);
          if(result.status === "success") {
            renderChart(result.votes);
          } else {
            alert("투표 처리 중 오류가 발생했습니다: " + result.message);
          }
        })
        .doPost({ postData: { contents: JSON.stringify({ option: selectedOption }) } });
    }

    // 백분율 계산 및 CSS 바 차트 렌더링
    function renderChart(data) {
      const countA = data.optionA || 0;
      const countB = data.optionB || 0;
      const total = countA + countB;

      // 백분율 계산
      const percentA = total === 0 ? 0 : Math.round((countA / total) * 100);
      const percentB = total === 0 ? 0 : Math.round((countB / total) * 100);

      // DOM 업데이트 (차트 폭 설정 및 텍스트 갱신)
      document.getElementById('barA').style.width = percentA + '%';
      document.getElementById('barB').style.width = percentB + '%';

      document.getElementById('percentA').innerText = `${percentA}% (${countA}표)`;
      document.getElementById('percentB').innerText = `${percentB}% (${countB}표)`;
      document.getElementById('totalVotes').innerText = `총 투표수: ${total}표`;
    }

    function setLoading(isLoading) {
      const btns = document.querySelectorAll('.btn');
      const loading = document.getElementById('loadingText');
      btns.forEach(b => b.disabled = isLoading);
      loading.style.display = isLoading ? 'block' : 'none';
    }
  </script>
</body>
</html>
