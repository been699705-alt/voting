<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역별 여행지 카드북</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🇰🇷 지역별 여행지 카드북</h1>
      <p>지역을 선택하면 관광 정보가 조회되고, 선택한 지역이 Firebase에 저장됩니다.</p>
    </header>

    <!-- 지역 선택 드롭다운 -->
    <section class="controls">
      <label for="area-select">지역 선택: </label>
      <select id="area-select">
        <option value="">-- 지역을 선택하세요 --</option>
        <option value="1">서울</option>
        <option value="2">인천</option>
        <option value="3">대전</option>
        <option value="4">대구</option>
        <option value="5">광주</option>
        <option value="6">부산</option>
        <option value="7">울산</option>
        <option value="8">세종</option>
        <option value="31">경기</option>
        <option value="32">강원</option>
        <option value="35">경북</option>
        <option value="36">경남</option>
        <option value="37">전북</option>
        <option value="38">전남</option>
        <option value="39">제주</option>
      </select>
    </section>

    <!-- 상태 메시지 -->
    <div id="status-message">데이터를 불러오는 중...</div>

    <!-- 관광지 카드 목록 -->
    <main id="card-container" class="card-grid"></main>
  </div>

  <!-- Firebase SDK (Modular CDN / ES Module 사용) -->
  <script type="module" src="app.js"></script>
</body>
</html>
